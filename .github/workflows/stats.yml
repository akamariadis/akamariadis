name: Fetch Github Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Download stats using curl
        run: curl "https://github-readme-stats.vercel.app/api/top-langs/?username=akamariadis&layout=compact&theme=dark" -o stats.svg
        
      - name: Commit and push updated SVG
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.svg
          git commit -m "Automated update of stats.svg" || exit 0
          git push
